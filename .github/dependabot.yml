# Weekly dependency PRs. Minor and patch bumps are grouped per ecosystem so a
# busy week is one PR to review rather than twenty; major bumps arrive as their
# own PRs, so one breaking upgrade (e.g. TypeScript 7 before typescript-eslint
# supports it) can't hold every other update hostage. Security fixes still
# arrive individually as soon as an advisory is published (Dependabot security
# updates, repo settings).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/app
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
