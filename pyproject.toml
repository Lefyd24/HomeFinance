[project]
name = "personalfinance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10",
    "cryptography>=42.0.0",
    "pywebpush>=2.0.0",
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.129.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "passlib>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.22",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.46",
    "statsmodels>=0.14.6",
    "uvicorn>=0.41.0",
    "tradernet-sdk>=2.2.0",
    "yfinance>=1.5.2",
    "python-binance>=1.0.29",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "fpdf2>=2.8.9",
]

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
