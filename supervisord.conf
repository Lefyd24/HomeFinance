[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

; The backend (main.py) serves the frontend itself via StaticFiles at "/", so
; there is no separate frontend program — one port, one process, same origin,
; which is what Tailscale Funnel requires.
; --forwarded-allow-ips matters behind Tailscale Serve/Funnel: without it
; uvicorn ignores X-Forwarded-Proto and builds absolute URLs (notably FastAPI's
; trailing-slash redirect) as http://, which the browser then blocks as mixed
; content on an https page. It cannot be left at uvicorn's 127.0.0.1 default
; because under Docker the proxy reaches us via the bridge gateway, not
; loopback. "*" is gated on TRUST_PROXY_HEADERS, whose own precondition is that
; the port is published on loopback so tailscaled is the only possible client.
[program:backend]
; FORWARDED_ALLOW_IPS is set in docker-entrypoint.sh from TRUST_PROXY_HEADERS
; (supervisord cannot parse nested quotes in inline /bin/sh -c commands).
command=uvicorn main:app --host 0.0.0.0 --port %(ENV_BACKEND_PORT)s --app-dir /app/backend --proxy-headers --forwarded-allow-ips %(ENV_FORWARDED_ALLOW_IPS)s
autostart=true
autorestart=true
stderr_logfile=/app/logs/backend.err.log
stdout_logfile=/app/logs/backend.out.log
environment=PYTHONUNBUFFERED="1"
