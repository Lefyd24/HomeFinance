[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=/bin/sh -c 'uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8223} --app-dir /app/backend'
autostart=true
autorestart=true
stderr_logfile=/app/logs/backend.err.log
stdout_logfile=/app/logs/backend.out.log
environment=PYTHONUNBUFFERED="1"

[program:frontend]
command=/bin/sh -c 'python -m http.server ${FRONTEND_PORT:-3100} --directory /app/frontend/public'
autostart=true
autorestart=true
stderr_logfile=/app/logs/frontend.err.log
stdout_logfile=/app/logs/frontend.out.log
