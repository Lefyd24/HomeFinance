<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Budgets - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Home Finance">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>
    
    <!-- Add Budget Modal -->
    <dialog id="budgetModal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box w-full sm:w-11/12 sm:max-w-2xl max-h-[95dvh] sm:max-h-[90vh] rounded-t-2xl sm:rounded-2xl overflow-y-auto p-4 sm:p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-base sm:text-lg"><span id="budgetModalTitle">Create Budget</span></h3>
                <button type="button" onclick="budgetModal.close(); resetBudgetModal()" class="btn btn-sm btn-circle btn-ghost">✕</button>
            </div>
            <form id="budgetForm" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Budget Name</span></label>
                    <input type="text" id="budgetName" name="name" class="input input-bordered w-full" required>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Amount</span></label>
                        <input type="number" id="budgetAmount" name="amount" step="0.01" inputmode="decimal" class="input input-bordered w-full" required>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Period</span></label>
                        <select id="budgetPeriod" name="period" class="select select-bordered w-full">
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="dateRangeFields">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Start Date</span></label>
                        <input type="date" id="startDate" name="startDate" class="input input-bordered w-full">
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">End Date</span></label>
                        <input type="date" id="endDate" name="endDate" class="input input-bordered w-full">
                    </div>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Categories</span></label>
                    <div id="categorySelection" class="grid grid-cols-1 sm:grid-cols-2 gap-1 max-h-48 overflow-y-auto p-2 border border-base-300 rounded-lg">
                        <!-- Categories will be loaded here -->
                    </div>
                </div>
                <div class="modal-action sticky bottom-0 bg-base-100 pt-2 -mx-4 sm:mx-0 px-4 sm:px-0 flex-col-reverse sm:flex-row gap-2">
                    <button type="button" class="btn btn-block sm:btn-wide sm:w-auto" onclick="budgetModal.close(); resetBudgetModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-block sm:btn-wide sm:w-auto"><span id="budgetSubmitButtonText">Create Budget</span></button>
                </div>
            </form>
        </div>
    </dialog>
    
    <!-- Budget Details Modal -->
    <dialog id="budgetDetailsModal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box w-full sm:w-11/12 sm:max-w-5xl max-h-[95dvh] sm:max-h-[90vh] rounded-t-2xl sm:rounded-2xl flex flex-col p-4 sm:p-6">
            <div class="flex justify-between items-center mb-3 shrink-0">
                <h3 class="font-bold text-base sm:text-lg" id="budgetDetailsTitle">Budget Details</h3>
                <button onclick="budgetDetailsModal.close()" class="btn btn-sm btn-circle btn-ghost">✕</button>
            </div>
            
            <!-- Budget Info -->
            <div id="budgetDetailsInfo" class="mb-3 shrink-0"></div>
            
            <!-- Period Breakdown - scrollable -->
            <div id="budgetTransactionsTable" class="overflow-y-auto flex-1 min-h-0"></div>
            
            <div class="modal-action mt-3 shrink-0">
                <button type="button" class="btn btn-block sm:btn-wide" onclick="budgetDetailsModal.close()">Close</button>
            </div>
        </div>
    </dialog>
    
    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/budgets.js"></script>
</body>
</html>
