<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Verify Email - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Home Finance">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <style>
        .auth-shell {
            min-height: 100dvh;
            padding-top: max(1.5rem, env(safe-area-inset-top));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }

        .state-icon {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }
        .state-icon.success { background: color-mix(in oklch, var(--color-success) 15%, transparent); color: var(--color-success); }
        .state-icon.error { background: color-mix(in oklch, var(--color-error) 15%, transparent); color: var(--color-error); }

        .form-input-group { position: relative; }
        .form-input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-base-content, #333);
            opacity: 0.35;
            pointer-events: none;
        }
        .form-input-padded { padding-left: 2.25rem; }

        .btn-auth {
            height: 2.75rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
    </style>
</head>
<body class="auth-shell min-h-screen flex items-center justify-center bg-base-200 px-4 sm:px-6">
    <div style="width:100%;max-width:24rem;">

        <div class="card w-full bg-base-100 shadow-xl">
            <div class="card-body items-center text-center p-6 sm:p-8">
                <div id="statePending">
                    <span class="loading loading-spinner loading-lg text-primary"></span>
                    <h2 class="text-xl font-bold text-base-content mt-4">Verifying your email...</h2>
                    <p class="text-sm text-base-content opacity-55 mt-1">This only takes a moment.</p>
                </div>

                <div id="stateSuccess" class="hidden w-full">
                    <div class="state-icon success">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-base-content">Email verified</h2>
                    <p class="text-sm text-base-content opacity-55 mt-1 mb-5">You can now sign in to your account.</p>
                    <a href="../index.html" class="btn btn-primary w-full btn-auth">Go to sign in</a>
                </div>

                <div id="stateError" class="hidden w-full">
                    <div class="state-icon error">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-base-content">Verification failed</h2>
                    <p id="errorText" class="text-sm text-base-content opacity-55 mt-1 mb-5">This link is invalid or has expired.</p>

                    <div class="flex flex-col gap-3 items-stretch text-left">
                        <label for="resendEmail" class="text-sm font-medium text-base-content" style="opacity:0.8;">Resend verification email</label>
                        <div class="form-input-group">
                            <span class="form-input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                                </svg>
                            </span>
                            <input type="email" id="resendEmail" placeholder="your@email.com" class="input input-bordered w-full form-input-padded" style="height:2.75rem;">
                        </div>
                        <button id="resendBtn" class="btn btn-primary w-full btn-auth">Resend email</button>
                        <a href="../index.html" class="text-primary text-sm font-semibold text-center mt-1">Back to sign in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/verify-email.js"></script>
</body>
</html>
