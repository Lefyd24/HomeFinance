<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Tracker - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>
    
    <!-- Create/Edit Debt Modal -->
    <dialog id="debtModal" class="modal modal-middle sm:modal-middle">
        <div class="modal-box max-w-xl p-0">
            <div class="bg-gradient-to-r from-error to-error/80 p-6 text-error-content">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-xl flex items-center gap-2">
                        <span id="modalTitle">Add Debt</span>
                    </h3>
                    <button type="button" onclick="debtModal.close()" class="btn btn-ghost btn-circle btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <form id="debtForm" class="p-6 space-y-5">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Debt Name</span>
                        <span class="label-text-alt text-error">*</span>
                    </label>
                    <input type="text" id="debtName" name="name" class="input input-bordered w-full" placeholder="e.g., Credit Card, Car Loan" required>
                </div>
                
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Creditor</span>
                        <span class="label-text-alt">Optional</span>
                    </label>
                    <input type="text" id="debtCreditor" name="creditor" class="input input-bordered w-full" placeholder="e.g., Bank of America">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Debt Type</span>
                            <span class="label-text-alt text-error">*</span>
                        </label>
                        <select id="debtType" name="type" class="select select-bordered w-full" required onchange="toggleCustomType()">
                            <option value="">Select type</option>
                            <optgroup label="Loans &amp; Credit">
                                <option value="credit_card">Credit Card</option>
                                <option value="personal_loan">Personal Loan</option>
                                <option value="student_loan">Student Loan</option>
                                <option value="mortgage">Mortgage</option>
                                <option value="car_loan">Car Loan</option>
                                <option value="informal">Personal / Informal</option>
                            </optgroup>
                            <optgroup label="Bills &amp; Obligations">
                                <option value="utilities">Utilities</option>
                                <option value="subscription">Subscription</option>
                                <option value="medical">Medical</option>
                                <option value="tax">Tax</option>
                                <option value="legal">Legal</option>
                            </optgroup>
                            <option value="other">Other</option>
                            <option value="custom">Custom...</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Priority</span>
                        </label>
                        <input type="number" id="debtPriority" name="priority" class="input input-bordered w-full" value="0" min="0">
                    </div>
                </div>

                <!-- Custom type input (shown when type = "custom") -->
                <div class="form-control hidden" id="customTypeContainer">
                    <label class="label py-1"><span class="label-text font-medium text-sm">Custom Type Name</span></label>
                    <input type="text" id="debtCustomType" name="custom_type" class="input input-bordered w-full" placeholder="e.g., Insurance, Rent, HOA Fee">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Original Balance</span>
                            <span class="label-text-alt text-error">*</span>
                        </label>
                        <input type="number" id="debtOriginalBalance" name="original_balance" step="0.01" class="input input-bordered w-full" required>
                    </div>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Current Balance</span>
                            <span class="label-text-alt text-error">*</span>
                        </label>
                        <input type="number" id="debtCurrentBalance" name="current_balance" step="0.01" class="input input-bordered w-full" required>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Interest Rate (%)</span>
                            <span class="label-text-alt">Annual</span>
                        </label>
                        <input type="number" id="debtInterestRate" name="interest_rate" step="0.01" min="0" max="100" class="input input-bordered w-full" placeholder="e.g., 15.99">
                    </div>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Minimum Payment</span>
                        </label>
                        <input type="number" id="debtMinimumPayment" name="minimum_payment" step="0.01" min="0" class="input input-bordered w-full">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Opened Date</span>
                        </label>
                        <input type="date" id="debtOpenedDate" name="opened_date" class="input input-bordered w-full">
                    </div>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Maturity Date</span>
                        </label>
                        <input type="date" id="debtMaturityDate" name="maturity_date" class="input input-bordered w-full">
                    </div>
                </div>
                
                <!-- Paid Off Status -->
                <div class="divider text-sm">Status</div>
                <div class="form-control" id="paidOffContainer">
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" id="debtIsPaidOff" name="is_paid_off" class="checkbox checkbox-sm checkbox-success" onchange="togglePaidOffDate()">
                        <span class="label-text font-medium">Mark as paid off</span>
                    </label>
                    <div id="paidOffDateContainer" class="mt-2 hidden">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Paid Off Date</span></label>
                        <input type="date" id="debtPaidOffDate" name="paid_off_date" class="input input-bordered w-full input-sm">
                    </div>
                </div>

                <!-- Recurrence Settings -->
                <div class="divider text-sm">Recurrence Settings</div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Payment Every</span>
                        </label>
                        <div class="flex gap-2">
                            <input type="number" id="debtRecurrenceInterval" name="recurrence_interval" class="input input-bordered w-24" min="1" value="1">
                            <select id="debtRecurrenceUnit" name="recurrence_unit" class="select select-bordered flex-1">
                                <option value="">Not recurring</option>
                                <option value="days">Days</option>
                                <option value="weeks">Weeks</option>
                                <option value="months" selected>Months</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Day of Month</span>
                            <span class="label-text-alt">For monthly</span>
                        </label>
                        <input type="number" id="debtRecurrenceDay" name="recurrence_day_of_month" class="input input-bordered w-full" min="1" max="31" placeholder="e.g., 15">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Linked Account</span>
                            <span class="label-text-alt">Optional</span>
                        </label>
                        <select id="debtLinkedAccount" name="linked_account_id" class="select select-bordered w-full">
                            <option value="">Select account...</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Next Payment Date</span>
                        </label>
                        <input type="date" id="debtNextPaymentDate" name="next_payment_date" class="input input-bordered w-full">
                    </div>
                </div>
                
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Notes</span>
                        <span class="label-text-alt">Optional</span>
                    </label>
                    <textarea id="debtNotes" name="notes" class="textarea textarea-bordered w-full" rows="2" placeholder="Any additional notes about this debt"></textarea>
                </div>
                
                <div class="modal-action pt-2 border-t border-base-200 mt-6">
                    <button type="button" class="btn btn-ghost" onclick="debtModal.close()">Cancel</button>
                    <button type="submit" class="btn btn-error px-6">Save Debt</button>
                </div>
            </form>
        </div>
    </dialog>
    
    <!-- Payment Modal -->
    <dialog id="paymentModal" class="modal modal-middle sm:modal-middle">
        <div class="modal-box max-w-lg p-0">
            <div class="bg-gradient-to-r from-success to-success/80 p-6 text-success-content">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-xl">Add Payment</h3>
                    <button type="button" onclick="paymentModal.close()" class="btn btn-ghost btn-circle btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <form id="paymentForm" class="p-6 space-y-5">
                <input type="hidden" id="paymentDebtId">
                
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Payment Amount</span>
                        <span class="label-text-alt text-error">*</span>
                    </label>
                    <input type="number" id="paymentAmount" step="0.01" min="0.01" class="input input-bordered w-full" required>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Principal Amount</span>
                            <span class="label-text-alt">Optional</span>
                        </label>
                        <input type="number" id="paymentPrincipal" step="0.01" min="0" class="input input-bordered w-full">
                    </div>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-medium">Interest Amount</span>
                            <span class="label-text-alt">Optional</span>
                        </label>
                        <input type="number" id="paymentInterest" step="0.01" min="0" class="input input-bordered w-full">
                    </div>
                </div>
                
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Payment Date</span>
                        <span class="label-text-alt text-error">*</span>
                    </label>
                    <input type="date" id="paymentDate" class="input input-bordered w-full" required>
                </div>
                
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Payment Account</span>
                        <span class="label-text-alt">Optional</span>
                    </label>
                    <select id="paymentAccount" class="select select-bordered w-full">
                        <option value="">Select account (creates transaction)...</option>
                    </select>
                    <label class="label">
                        <span class="label-text-alt text-info">Selecting an account will create a transaction record</span>
                    </label>
                </div>
                
                <div class="form-control">
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" id="paymentCreateTransaction" class="checkbox" checked>
                        <span class="label-text">Create transaction record</span>
                    </label>
                </div>
                
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Notes</span>
                        <span class="label-text-alt">Optional</span>
                    </label>
                    <input type="text" id="paymentNotes" class="input input-bordered w-full" placeholder="e.g., Monthly payment">
                </div>
                
                <div class="modal-action pt-2 border-t border-base-200 mt-6">
                    <button type="button" class="btn btn-ghost" onclick="paymentModal.close()">Cancel</button>
                    <button type="submit" class="btn btn-success px-6">Add Payment</button>
                </div>
            </form>
        </div>
    </dialog>
    
    <!-- Debt Details Modal -->
    <dialog id="debtDetailsModal" class="modal modal-middle sm:modal-middle">
        <div class="modal-box max-w-2xl max-h-[90vh] overflow-y-auto p-0">
            <div class="bg-gradient-to-r from-error to-error/80 p-6 text-error-content">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-xl" id="debtDetailsTitle">Debt Details</h3>
                    <button onclick="debtDetailsModal.close()" class="btn btn-ghost btn-circle btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="debtDetailsContent" class="p-6"></div>
            
            <div class="modal-action p-6 pt-0">
                <button type="button" class="btn" onclick="debtDetailsModal.close()">Close</button>
            </div>
        </div>
    </dialog>
    
    <!-- Payoff Strategy Modal -->
    <dialog id="strategyModal" class="modal modal-middle sm:modal-middle">
        <div class="modal-box max-w-4xl max-h-[90vh] overflow-y-auto p-0">
            <div class="bg-gradient-to-r from-primary to-primary/80 p-6 text-primary-content">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-xl">Payoff Strategy Comparison</h3>
                    <button onclick="strategyModal.close()" class="btn btn-ghost btn-circle btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="strategyContent" class="p-6"></div>
            
            <div class="modal-action p-6 pt-0">
                <button type="button" class="btn" onclick="strategyModal.close()">Close</button>
            </div>
        </div>
    </dialog>
    
    <script src="../js/utils.js?v=20260220b"></script>
    <script src="../js/runtime-config.js?v=20260220b"></script>
    <script src="../js/api.js?v=20260220b"></script>
    <script src="../js/auth.js?v=20260220b"></script>
    <script src="../js/components/layout.js?v=20260220b"></script>
    <script src="../js/pages/debts.js?v=20260220b"></script>
</body>
</html>
