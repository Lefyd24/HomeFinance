<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Personal Finance</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>
    
    <!-- Add Category Modal -->
    <dialog id="categoryModal" class="modal">
        <div class="modal-box w-11/12 max-w-lg">
            <h3 class="font-bold text-lg mb-4">Add Category</h3>
            <form id="categoryForm" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Category Name</span></label>
                    <input type="text" id="categoryName" name="name" class="input input-bordered" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Type</span></label>
                        <select id="categoryType" name="type" class="select select-bordered w-full">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                            <option value="transfer">Transfer</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Color</span></label>
                        <input type="color" id="categoryColor" name="color" value="#3B82F6" 
                               class="input input-bordered h-12 p-1">
                    </div>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Icon</span></label>
                    <select id="categoryIcon" name="icon" class="select select-bordered w-full">
                        <option value="default">Default</option>
                        <option value="shopping">Shopping</option>
                        <option value="food">Food</option>
                        <option value="transport">Transport</option>
                        <option value="home">Home</option>
                        <option value="health">Health</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="bills">Bills</option>
                        <option value="salary">Salary</option>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Parent Category</span></label>
                    <select id="parentCategory" name="parentId" class="select select-bordered w-full">
                        <option value="">None (Top Level)</option>
                        <!-- Parent categories will be loaded here -->
                    </select>
                </div>
                <div class="modal-action">
                    <button type="button" class="btn" onclick="categoryModal.close()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Category</button>
                </div>
            </form>
        </div>
    </dialog>
    
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/categories.js"></script>
</body>
</html>
