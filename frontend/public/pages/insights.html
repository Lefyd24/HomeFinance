<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Insights - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>
    
    <template id="insights-template">
        <div class="space-y-6">
            <!-- Header with Financial Health Score -->
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold flex items-center gap-3">
                        <span class="text-3xl">📊</span>
                        Financial Analytics Dashboard
                    </h1>
                    <p class="text-base-content/60 mt-1">ML-powered insights and predictions for your finances</p>
                </div>
                <div class="flex gap-2">
                    <select id="analysisMonths" class="select select-bordered select-sm">
                        <option value="3">Last 3 months</option>
                        <option value="6" selected>Last 6 months</option>
                        <option value="12">Last 12 months</option>
                    </select>
                    <button onclick="refreshAnalytics()" class="btn btn-primary btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>
            
            <!-- Financial Health Score Card -->
            <div class="card bg-gradient-to-r from-primary/10 to-secondary/10 shadow-xl border border-primary/20">
                <div class="card-body p-4 lg:p-6">
                    <div class="flex flex-col lg:flex-row items-center gap-6">
                        <!-- Health Score Gauge -->
                        <div class="flex flex-col items-center">
                            <div class="relative">
                                <canvas id="healthScoreGauge" width="160" height="160"></canvas>
                                <div class="absolute inset-0 flex flex-col items-center justify-center">
                                    <span id="healthScoreValue" class="text-4xl font-bold">--</span>
                                    <span id="healthScoreGrade" class="text-lg font-medium text-base-content/60">--</span>
                                </div>
                            </div>
                            <p class="text-sm font-medium mt-2">Financial Health</p>
                        </div>
                        
                        <!-- Key Metrics -->
                        <div class="flex-1 grid grid-cols-2 lg:grid-cols-4 gap-4 w-full">
                            <div class="stat bg-base-100 rounded-lg p-3 shadow-sm">
                                <div class="stat-title text-xs">Savings Rate</div>
                                <div class="stat-value text-lg" id="savingsRateValue">--%</div>
                                <div class="stat-desc text-xs" id="savingsRateStatus">Loading...</div>
                            </div>
                            <div class="stat bg-base-100 rounded-lg p-3 shadow-sm">
                                <div class="stat-title text-xs">Spending Trend</div>
                                <div class="stat-value text-lg flex items-center gap-1" id="spendingTrendValue">
                                    <span>--</span>
                                </div>
                                <div class="stat-desc text-xs" id="spendingTrendChange">vs last month</div>
                            </div>
                            <div class="stat bg-base-100 rounded-lg p-3 shadow-sm">
                                <div class="stat-title text-xs">30-Day Forecast</div>
                                <div class="stat-value text-lg" id="forecastValue">€--</div>
                                <div class="stat-desc text-xs" id="forecastConfidence">Loading...</div>
                            </div>
                            <div class="stat bg-base-100 rounded-lg p-3 shadow-sm">
                                <div class="stat-title text-xs">Top Category</div>
                                <div class="stat-value text-lg truncate" id="topCategoryValue">--</div>
                                <div class="stat-desc text-xs" id="topCategoryAmount">Loading...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content Grid -->
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <!-- Left Column - Charts -->
                <div class="xl:col-span-2 space-y-6">
                    <!-- Spending Forecast Chart -->
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <div class="flex justify-between items-center mb-2">
                                <h2 class="card-title text-lg">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                                    </svg>
                                    Spending Forecast
                                </h2>
                                <select id="forecastDays" class="select select-bordered select-xs" onchange="loadSpendingForecast()">
                                    <option value="30" selected>30 days</option>
                                    <option value="60">60 days</option>
                                    <option value="90">90 days</option>
                                </select>
                            </div>
                            <div id="forecastDescription" class="mb-3"></div>
                            <div class="h-64 lg:h-72">
                                <canvas id="forecastChart"></canvas>
                            </div>
                            <div class="mt-3 flex flex-wrap gap-4 text-sm">
                                <div class="flex items-center gap-2">
                                    <span class="w-3 h-3 rounded-full bg-primary"></span>
                                    <span>Predicted Daily Spending</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="w-8 h-3 bg-primary/20 rounded"></span>
                                    <span>Confidence Range</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Two-column charts -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Category Distribution -->
                        <div class="card bg-base-100 shadow-xl">
                            <div class="card-body">
                                <h2 class="card-title text-lg">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
                                    </svg>
                                    Category Distribution
                                </h2>
                                <div id="categoryDescription" class="mb-2"></div>
                                <div class="h-52">
                                    <canvas id="categoryChart"></canvas>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Spending Heatmap -->
                        <div class="card bg-base-100 shadow-xl">
                            <div class="card-body">
                                <h2 class="card-title text-lg">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                    </svg>
                                    Weekly Spending Pattern
                                </h2>
                                <div id="heatmapDescription" class="mb-2"></div>
                                <div class="h-52">
                                    <canvas id="heatmapChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Cashflow Projection -->
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <div class="flex justify-between items-center mb-2">
                                <h2 class="card-title text-lg">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-info" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                                    </svg>
                                    Balance Projection
                                </h2>
                                <div class="badge badge-soft badge-info" id="projectionTrend">Loading...</div>
                            </div>
                            <div id="cashflowDescription" class="mb-3"></div>
                            <div class="h-56">
                                <canvas id="cashflowChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Recommendations -->
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <h2 class="card-title text-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                                </svg>
                                Smart Recommendations
                            </h2>
                            <div id="recommendationsContainer" class="mt-2">
                                <div class="loading loading-spinner loading-md mx-auto block"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Right Column - ML Insights & Stats -->
                <div class="space-y-6">
                    <!-- Spending Persona -->
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <h2 class="card-title text-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-warning" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                Your Spending Persona
                            </h2>
                            <div id="personaContainer" class="mt-2">
                                <div class="loading loading-spinner loading-md mx-auto block"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Budget Optimization -->
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <h2 class="card-title text-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                </svg>
                                Budget Optimization
                            </h2>
                            <div id="budgetOptContainer" class="mt-2">
                                <div class="loading loading-spinner loading-md mx-auto block"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Health Score Breakdown -->
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <h2 class="card-title text-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                                </svg>
                                Health Score Breakdown
                            </h2>
                            <div id="healthBreakdownContainer" class="mt-2">
                                <div class="loading loading-spinner loading-md mx-auto block"></div>
                            </div>
                        </div>
                    </div>
                    
                    
                    <!-- Spending Clusters -->
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <h2 class="card-title text-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                </svg>
                                Spending Clusters
                            </h2>
                            <div id="clustersContainer" class="mt-2">
                                <div class="loading loading-spinner loading-md mx-auto block"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/insights.js"></script>
</body>
</html>
