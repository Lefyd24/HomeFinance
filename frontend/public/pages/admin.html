<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <style>
        .invite-code-display {
            font-family: 'Courier New', monospace;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app">
        <!-- Content will be injected by layout.js -->
    </div>

    <template id="admin-content">
        <div class="space-y-6">
            <!-- Invite codes -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <div class="flex items-center justify-between flex-wrap gap-3">
                        <h2 class="card-title text-xl flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                            </svg>
                            Invite Codes
                        </h2>
                        <button class="btn btn-primary btn-sm" onclick="AdminPage.openCreateInviteModal()">
                            + New invite
                        </button>
                    </div>
                    <p class="text-base-content/70 mt-2">
                        Registration is invite-only. Generate a single-use code and share it with the
                        person you want to invite — it can only be used once.
                    </p>

                    <div class="overflow-x-auto mt-4">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Label</th>
                                    <th>Status</th>
                                    <th>Expires</th>
                                    <th>Used by</th>
                                    <th>Created</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="invitesTableBody">
                                <tr><td colspan="6" class="text-center text-base-content/50 py-6">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Users -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title text-xl flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 100-8 4 4 0 000 8zm6 0a4 4 0 10-1-7.87" />
                        </svg>
                        Users
                    </h2>

                    <div class="overflow-x-auto mt-4">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Email</th>
                                    <th>Name</th>
                                    <th>Verified</th>
                                    <th>Admin</th>
                                    <th>Status</th>
                                    <th>Joined</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <tr><td colspan="7" class="text-center text-base-content/50 py-6">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create invite modal -->
        <dialog id="createInviteModal" class="modal">
            <div class="modal-box">
                <h3 class="font-bold text-lg mb-4">New invite code</h3>
                <form id="createInviteForm" class="flex flex-col gap-4">
                    <div>
                        <label class="label text-sm font-medium">Label <span class="opacity-50 font-normal">(optional)</span></label>
                        <input type="text" id="inviteLabel" class="input input-bordered w-full" placeholder="e.g. Maria">
                    </div>
                    <div>
                        <label class="label text-sm font-medium">Expires in (days) <span class="opacity-50 font-normal">(optional — leave blank for no expiry)</span></label>
                        <input type="number" id="inviteExpiresDays" min="1" max="365" class="input input-bordered w-full" placeholder="e.g. 14">
                    </div>
                    <div class="modal-action">
                        <button type="button" class="btn btn-ghost" onclick="document.getElementById('createInviteModal').close()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Generate</button>
                    </div>
                </form>
            </div>
            <form method="dialog" class="modal-backdrop"><button>close</button></form>
        </dialog>

        <!-- Show new invite code modal -->
        <dialog id="showInviteModal" class="modal">
            <div class="modal-box">
                <h3 class="font-bold text-lg mb-1 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Invite code created
                </h3>
                <p class="text-sm text-base-content/70 mb-4">
                    <strong class="text-error">Copy it now!</strong> This code will not be shown again —
                    only its hash is stored.
                </p>
                <div class="bg-base-200 rounded-lg p-4 mb-4">
                    <label class="label text-sm font-medium">Invite code</label>
                    <div class="flex gap-2">
                        <input type="text" id="newInviteCode" readonly class="input input-bordered w-full font-mono text-sm invite-code-display" />
                        <button type="button" class="btn btn-square btn-primary" onclick="AdminPage.copyNewInviteCode()" title="Copy to clipboard">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="modal-action">
                    <button type="button" class="btn btn-primary" onclick="document.getElementById('showInviteModal').close(); AdminPage.loadInvites();">
                        I've copied the code
                    </button>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop"><button>close</button></form>
        </dialog>
    </template>

    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/admin.js"></script>
</body>
</html>
