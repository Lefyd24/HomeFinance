<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Recurring Expenses - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Home Finance">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>

    <!-- Create/Edit Modal -->
    <dialog id="recurringModal" class="modal modal-middle">
        <div class="modal-box max-w-xl">
            <h3 class="font-bold text-lg mb-4" id="recurringModalTitle">Add Recurring Expense</h3>
            <form id="recurringForm" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Name</span></label>
                    <input type="text" id="reName" name="name" class="input input-bordered w-full" placeholder="e.g., Netflix, Rent" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text font-medium">Amount (€)</span></label>
                        <input type="number" id="reAmount" name="amount" step="0.01" min="0.01" class="input input-bordered w-full" required>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text font-medium">Account</span></label>
                        <select id="reAccount" name="account_id" class="select select-bordered w-full">
                            <option value="">None</option>
                        </select>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Category</span></label>
                    <select id="reCategory" name="category_id" class="select select-bordered w-full">
                        <option value="">None</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text font-medium">Start Date</span></label>
                        <input type="date" id="reStartDate" name="start_date" class="input input-bordered w-full" required>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text font-medium">Next Due Date</span></label>
                        <input type="date" id="reNextDueDate" name="next_due_date" class="input input-bordered w-full" required>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Repeats every</span></label>
                    <div class="flex gap-2">
                        <input type="number" id="reInterval" name="recurrence_interval" min="1" value="1" class="input input-bordered w-24" required>
                        <select id="reUnit" name="recurrence_unit" class="select select-bordered flex-1" required>
                            <option value="days">Days</option>
                            <option value="weeks">Weeks</option>
                            <option value="months" selected>Months</option>
                        </select>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Notes</span></label>
                    <textarea id="reNotes" name="notes" class="textarea textarea-bordered w-full" rows="2"></textarea>
                </div>
                <div class="modal-action pt-2">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('recurringModal').close()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- Mark as Paid Modal -->
    <dialog id="payRecurringModal" class="modal modal-middle">
        <div class="modal-box max-w-md">
            <h3 class="font-bold text-lg mb-4">Mark as Paid</h3>
            <p class="text-sm text-base-content/60 mb-4" id="payRecurringDesc"></p>
            <form id="payRecurringForm" class="space-y-4">
                <input type="hidden" id="payRecurringId">
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Amount Paid (€)</span></label>
                    <input type="number" id="payRecurringAmount" step="0.01" min="0.01" class="input input-bordered w-full" required>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Payment Date</span></label>
                    <input type="date" id="payRecurringDate" class="input input-bordered w-full" required>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Link to existing transaction (optional)</span></label>
                    <select id="payRecurringTxn" class="select select-bordered w-full">
                        <option value="">No transaction link</option>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Notes</span></label>
                    <input type="text" id="payRecurringNotes" class="input input-bordered w-full" placeholder="Optional">
                </div>
                <div class="modal-action pt-2">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('payRecurringModal').close()">Cancel</button>
                    <button type="submit" class="btn btn-success">Mark as Paid</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- Linked Transactions Details Modal -->
    <dialog id="recurringDetailsModal" class="modal modal-middle">
        <div class="modal-box max-w-3xl p-0 overflow-hidden">
            <div class="px-6 py-5" style="background: color-mix(in oklch, var(--color-base-100) 92%, var(--color-primary) 8%); border-bottom: 1px solid color-mix(in oklch, var(--color-base-content) 8%, transparent);">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <h3 class="font-bold text-lg leading-tight" id="recurringDetailsTitle">Recurring Payment</h3>
                        <p class="text-xs text-base-content/60 mt-0.5" id="recurringDetailsSubtitle">—</p>
                    </div>
                    <button type="button" class="btn btn-ghost btn-sm btn-square" onclick="document.getElementById('recurringDetailsModal').close()" aria-label="Close">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
            </div>
            <div id="recurringDetailsBody" class="p-6">
                <p class="text-base-content/60 text-sm">Loading…</p>
            </div>
            <div class="px-6 py-4 flex justify-end gap-2" style="border-top: 1px solid color-mix(in oklch, var(--color-base-content) 8%, transparent);">
                <button type="button" id="recurringDetailsEnableBtn" class="btn btn-primary btn-sm hidden" onclick="enableFromDetailsModal()">Enable</button>
                <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('recurringDetailsModal').close()">Close</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js?v=20260715a"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/recurring-expenses.js?v=20260715a"></script>
</body>
</html>
