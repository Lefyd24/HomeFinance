<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>API Keys - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Home Finance">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <style>
        .api-key-display {
            font-family: 'Courier New', monospace;
            letter-spacing: 0.1em;
        }
        .copy-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app">
        <!-- Content will be injected by layout.js -->
    </div>
    
    <!-- Main Content Template -->
    <template id="api-keys-content">
        <div class="space-y-6">
            <!-- API Key Status Card -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title text-xl flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                        </svg>
                        API Key Management
                    </h2>
                    <p class="text-base-content/70 mt-2">
                        Use API keys to authenticate programmatic access to your financial data. 
                        API keys can be used to query accounts, transactions, budgets, debts, reports, and more 
                        from external scripts, automations, or integrations.
                    </p>
                    
                    <div id="apiKeyStatusContainer" class="mt-6">
                        <!-- Status will be loaded here -->
                    </div>
                </div>
            </div>
            
            <!-- API Key Usage Card -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title text-lg flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-info" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        How to Use Your API Key
                    </h2>
                    
                    <div class="space-y-4 mt-4">
                        <div class="bg-base-200 rounded-lg p-4">
                            <h3 class="font-medium text-sm mb-2">HTTP Header</h3>
                            <p class="text-sm text-base-content/70 mb-2">
                                Include your API key in the <code class="bg-base-300 px-1 py-0.5 rounded">X-API-Key</code> header of your requests:
                            </p>
                            <div class="mockup-code bg-neutral text-neutral-content">
                                <pre><code>curl -H "X-API-Key: your_api_key_here" \\
  https://your-domain:8224/api/transactions</code></pre>
                            </div>
                        </div>
                        
                        <div class="bg-base-200 rounded-lg p-4">
                            <h3 class="font-medium text-sm mb-2">Available Endpoints</h3>
                            <p class="text-xs text-base-content/60 mb-3">Pass your API key via the <code class="bg-base-300 px-1 py-0.5 rounded text-xs">X-API-Key</code> header to access any of these endpoints:</p>

                            <details class="mb-2" open>
                                <summary class="cursor-pointer font-medium text-sm text-primary mb-1">Transactions</summary>
                                <ul class="space-y-1.5 text-sm text-base-content/70 ml-2">
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/transactions</code>
                                        <span>- List with filters</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/transactions</code>
                                        <span>- Create a new transaction</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/transactions/{id}</code>
                                        <span>- Get by ID</span>
                                    </li>
                                </ul>
                            </details>

                            <details class="mb-2">
                                <summary class="cursor-pointer font-medium text-sm text-primary mb-1">Accounts</summary>
                                <ul class="space-y-1.5 text-sm text-base-content/70 ml-2">
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/accounts</code>
                                        <span>- List accounts with balances</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/accounts</code>
                                        <span>- Create an account</span>
                                    </li>
                                </ul>
                            </details>

                            <details class="mb-2">
                                <summary class="cursor-pointer font-medium text-sm text-primary mb-1">Budgets</summary>
                                <ul class="space-y-1.5 text-sm text-base-content/70 ml-2">
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/budgets</code>
                                        <span>- List budgets with progress</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/budgets</code>
                                        <span>- Create a budget</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/budgets/{id}</code>
                                        <span>- Get budget details</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/budgets/{id}/progress</code>
                                        <span>- Budget spending progress</span>
                                    </li>
                                </ul>
                            </details>

                            <details class="mb-2">
                                <summary class="cursor-pointer font-medium text-sm text-primary mb-1">Debts</summary>
                                <ul class="space-y-1.5 text-sm text-base-content/70 ml-2">
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/debts</code>
                                        <span>- List debts</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/debts/summary</code>
                                        <span>- Debt summary &amp; payoff plan</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/debts</code>
                                        <span>- Add a new debt</span>
                                    </li>
                                </ul>
                            </details>

                            <details class="mb-2">
                                <summary class="cursor-pointer font-medium text-sm text-primary mb-1">Categories</summary>
                                <ul class="space-y-1.5 text-sm text-base-content/70 ml-2">
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/categories</code>
                                        <span>- List categories</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/categories</code>
                                        <span>- Create a category</span>
                                    </li>
                                </ul>
                            </details>

                            <details class="mb-2">
                                <summary class="cursor-pointer font-medium text-sm text-primary mb-1">Goals &amp; Reports</summary>
                                <ul class="space-y-1.5 text-sm text-base-content/70 ml-2">
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/goals</code>
                                        <span>- List financial goals</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/goals</code>
                                        <span>- Create a goal</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/reports</code>
                                        <span>- Spending &amp; cashflow reports</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/reports/saved</code>
                                        <span>- Saved reports</span>
                                    </li>
                                </ul>
                            </details>

                            <details class="mb-2">
                                <summary class="cursor-pointer font-medium text-sm text-primary mb-1">Financial Advisor</summary>
                                <ul class="space-y-1.5 text-sm text-base-content/70 ml-2">
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/advisor/investment/calculate</code>
                                        <span>- Investment calculations</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/advisor/loan/amortization</code>
                                        <span>- Loan amortization tables</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/advisor/investment/retirement</code>
                                        <span>- Retirement projections</span>
                                    </li>
                                </ul>
                            </details>

                            <details>
                                <summary class="cursor-pointer font-medium text-sm text-primary mb-1">Documents &amp; Imports</summary>
                                <ul class="space-y-1.5 text-sm text-base-content/70 ml-2">
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/documents/upload</code>
                                        <span>- Upload a document</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/documents</code>
                                        <span>- List documents</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-info">POST</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/import/upload</code>
                                        <span>- Upload bank files for import</span>
                                    </li>
                                    <li class="flex items-start gap-2">
                                        <span class="badge badge-sm badge-success">GET</span>
                                        <code class="bg-base-300 px-1 rounded text-xs">/api/import/batches</code>
                                        <span>- List import batches</span>
                                    </li>
                                </ul>
                            </details>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Security Tips Card -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title text-lg flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-warning" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        Security Tips
                    </h2>
                    
                    <ul class="space-y-2 mt-4 text-sm text-base-content/70">
                        <li class="flex items-start gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-success shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>Store your API key securely - it grants access to your financial data</span>
                        </li>
                        <li class="flex items-start gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-success shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>Never commit API keys to version control or share them publicly</span>
                        </li>
                        <li class="flex items-start gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-success shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>Rotate your API key periodically by generating a new one</span>
                        </li>
                        <li class="flex items-start gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-success shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>Revoke the API key immediately if you suspect it has been compromised</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- Generate API Key Modal -->
        <dialog id="generateKeyModal" class="modal modal-middle sm:modal-middle">
            <div class="modal-box">
                <h3 class="font-bold text-lg mb-2">Generate New API Key</h3>
                <p class="text-sm text-base-content/70 mb-4">
                    Are you sure you want to generate a new API key? 
                    This will replace your existing key. Applications using the old key will stop working.
                </p>
                
                <div class="alert alert-warning">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <span class="text-sm">Your current API key will be permanently deleted and cannot be recovered.</span>
                </div>
                
                <div class="modal-action mt-4">
                    <button type="button" class="btn btn-ghost" onclick="generateKeyModal.close()">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="ApiKeyPage.generateNewKey()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                        </svg>
                        Generate New Key
                    </button>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
        
        <!-- Revoke API Key Modal -->
        <dialog id="revokeKeyModal" class="modal modal-middle sm:modal-middle">
            <div class="modal-box">
                <h3 class="font-bold text-lg mb-2 text-error">Revoke API Key</h3>
                <p class="text-sm text-base-content/70 mb-4">
                    Are you sure you want to revoke your API key? 
                    This will permanently delete it and all applications using it will stop working immediately.
                </p>
                
                <div class="alert alert-error">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <span class="text-sm">This action cannot be undone. You will need to generate a new key to use the API again.</span>
                </div>
                
                <div class="modal-action mt-4">
                    <button type="button" class="btn btn-ghost" onclick="revokeKeyModal.close()">Cancel</button>
                    <button type="button" class="btn btn-error" onclick="ApiKeyPage.revokeKey()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        Revoke Key
                    </button>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
        
        <!-- Show New API Key Modal -->
        <dialog id="showNewKeyModal" class="modal modal-middle sm:modal-middle">
            <div class="modal-box">
                <h3 class="font-bold text-lg mb-2 text-success flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    API Key Generated
                </h3>
                <p class="text-sm text-base-content/70 mb-4">
                    Your new API key has been generated. <strong class="text-error">Copy it now!</strong> 
                    For security reasons, this is the only time you will be able to view it.
                </p>
                
                <div class="bg-base-200 rounded-lg p-4 mb-4">
                    <label class="label text-sm font-medium">Your API Key</label>
                    <div class="flex gap-2">
                        <input type="text" id="newApiKey" readonly 
                            class="input input-bordered w-full font-mono text-sm api-key-display" />
                        <button type="button" class="btn btn-square btn-primary copy-btn" onclick="ApiKeyPage.copyNewKey()" title="Copy to clipboard">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="modal-action">
                    <button type="button" class="btn btn-primary" onclick="showNewKeyModal.close(); ApiKeyPage.loadApiKeyStatus();">
                        I've Copied My Key
                    </button>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
    </template>
    
    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/api-keys.js"></script>
</body>
</html>
