<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reset Password - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Home Finance">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <style>
        .auth-shell {
            min-height: 100dvh;
            padding-top: max(1.5rem, env(safe-area-inset-top));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }

        .mobile-logo {
            width: 2.75rem;
            height: 2.75rem;
            background-color: oklch(52% 0.105 223.128);
            color: oklch(98% 0.019 200.873);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .form-input-group { position: relative; }

        .form-input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-base-content, #333);
            opacity: 0.35;
            pointer-events: none;
        }

        .form-input-padded { padding-left: 2.25rem; }
        .form-input-padded-right { padding-right: 2.25rem; }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-base-content, #333);
            opacity: 0.4;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .password-toggle:hover { opacity: 0.7; }

        .btn-auth {
            height: 2.75rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-auth:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px oklch(52% 0.105 223.128 / 0.35);
        }
    </style>
</head>
<body class="auth-shell min-h-screen flex items-center justify-center bg-base-200 px-4 sm:px-6">
    <div style="width:100%;max-width:24rem;">

        <div class="flex items-center gap-3 mb-7">
            <div class="mobile-logo">
                <img src="/assets/icons/favicon.ico" alt="Home Finance" class="h-7 w-7" />
            </div>
            <span class="font-bold text-lg text-base-content">Home Finance</span>
        </div>

        <div class="mb-7">
            <h2 class="text-2xl sm:text-3xl font-bold text-base-content" style="line-height:1.2;letter-spacing:-0.02em;">Reset password</h2>
            <p class="text-base-content mt-2 text-sm" style="opacity:0.55;">Choose a new password for your account.</p>
        </div>

        <form id="resetPasswordForm" class="flex flex-col gap-4">
            <div>
                <label for="newPassword" class="text-sm font-medium text-base-content" style="display:block;margin-bottom:0.375rem;opacity:0.8;">New password <span style="opacity:0.45;font-weight:400;font-size:0.75rem;">(min. 8 characters)</span></label>
                <div class="form-input-group">
                    <span class="form-input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </span>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Create a strong password"
                           class="input input-bordered w-full form-input-padded form-input-padded-right"
                           style="height:2.75rem;" required minlength="8" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('newPassword','eyeIcon1')" aria-label="Toggle password">
                        <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="eyeIcon1">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <label for="confirmPassword" class="text-sm font-medium text-base-content" style="display:block;margin-bottom:0.375rem;opacity:0.8;">Confirm password</label>
                <div class="form-input-group">
                    <span class="form-input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </span>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password"
                           class="input input-bordered w-full form-input-padded form-input-padded-right"
                           style="height:2.75rem;" required autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword','eyeIcon2')" aria-label="Toggle password">
                        <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="eyeIcon2">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="errorMessage" class="alert alert-error hidden" style="padding:0.625rem 0.875rem;border-radius:0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span id="errorText" class="text-sm"></span>
            </div>
            <div id="successMessage" class="alert alert-success hidden" style="padding:0.625rem 0.875rem;border-radius:0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span id="successText" class="text-sm"></span>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-full btn-auth">
                <span id="btnText">Reset password</span>
                <span id="loadingSpinner" class="loading loading-spinner loading-sm hidden"></span>
            </button>
        </form>

        <p class="text-sm text-center text-base-content" style="margin-top:1.5rem;opacity:0.6;">
            <a href="../index.html" class="text-primary font-semibold" style="opacity:1;">Back to sign in</a>
        </p>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.574-2.912m2.197-2.197A10.05 10.05 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-2.033 3.533M9 9l3 3m-3 3l6-6"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
            }
        }
    </script>
    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/reset-password.js"></script>
</body>
</html>
