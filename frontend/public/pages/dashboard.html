<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app">
        <!-- Sidebar and main content will be injected here -->
    </div>
    
    <!-- Skeleton Loading Template -->
    <template id="dashboard-skeleton">
        <div class="space-y-6">
            <!-- Skeleton Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div class="card bg-base-100 shadow-sm border border-primary">
                    <div class="card-body">
                        <div class="flex items-center gap-3">
                            <div class="skeleton w-12 h-12 rounded-lg shrink-0"></div>
                            <div class="flex-1">
                                <div class="skeleton h-3 w-24 mb-2"></div>
                                <div class="skeleton h-8 w-28"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card bg-base-100 shadow-sm">
                    <div class="card-body">
                        <div class="flex items-center gap-3">
                            <div class="skeleton w-12 h-12 rounded-lg shrink-0"></div>
                            <div class="flex-1">
                                <div class="skeleton h-3 w-24 mb-2"></div>
                                <div class="skeleton h-8 w-28"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card bg-base-100 shadow-sm">
                    <div class="card-body">
                        <div class="flex items-center gap-3">
                            <div class="skeleton w-12 h-12 rounded-lg shrink-0"></div>
                            <div class="flex-1">
                                <div class="skeleton h-3 w-24 mb-2"></div>
                                <div class="skeleton h-8 w-28"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card bg-base-100 shadow-sm">
                    <div class="card-body">
                        <div class="flex items-center gap-3">
                            <div class="skeleton w-12 h-12 rounded-lg shrink-0"></div>
                            <div class="flex-1">
                                <div class="skeleton h-3 w-24 mb-2"></div>
                                <div class="skeleton h-8 w-28"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Skeleton Account Balances -->
            <div class="card bg-base-100 shadow-sm mb-6">
                <div class="card-body">
                    <div class="flex justify-between items-center mb-4">
                        <div class="skeleton h-6 w-40"></div>
                        <div class="skeleton h-8 w-20"></div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                        <div class="bg-base-200 rounded-lg p-3">
                            <div class="flex items-center gap-3">
                                <div class="skeleton w-10 h-10 rounded-lg shrink-0"></div>
                                <div class="flex-1">
                                    <div class="skeleton h-4 w-24 mb-1"></div>
                                    <div class="skeleton h-3 w-16 mb-1"></div>
                                    <div class="skeleton h-4 w-20"></div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-base-200 rounded-lg p-3">
                            <div class="flex items-center gap-3">
                                <div class="skeleton w-10 h-10 rounded-lg shrink-0"></div>
                                <div class="flex-1">
                                    <div class="skeleton h-4 w-24 mb-1"></div>
                                    <div class="skeleton h-3 w-16 mb-1"></div>
                                    <div class="skeleton h-4 w-20"></div>
                                </div>
                            </div>
                        </div>
                        <div class="bg-base-200 rounded-lg p-3">
                            <div class="flex items-center gap-3">
                                <div class="skeleton w-10 h-10 rounded-lg shrink-0"></div>
                                <div class="flex-1">
                                    <div class="skeleton h-4 w-24 mb-1"></div>
                                    <div class="skeleton h-3 w-16 mb-1"></div>
                                    <div class="skeleton h-4 w-20"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Skeleton Main Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 lg:gap-6">
                <!-- Skeleton Spending Chart -->
                <div class="lg:col-span-2">
                    <div class="card bg-base-100 shadow-lg lg:shadow-xl">
                        <div class="card-body p-4 lg:p-6">
                            <div class="skeleton h-6 w-40 mb-4"></div>
                            <div class="h-64 lg:h-80">
                                <div class="skeleton w-full h-full rounded-lg"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Skeleton Trend Analysis -->
                    <div class="card bg-base-100 shadow-xl mt-6">
                        <div class="card-body">
                            <div class="skeleton h-6 w-40 mb-4"></div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="skeleton h-24 rounded-lg"></div>
                                <div class="skeleton h-24 rounded-lg"></div>
                            </div>
                            <div class="skeleton h-32 mt-4 rounded-lg"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Skeleton Budget & Goals Overview -->
                <div>
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <div class="skeleton h-6 w-32 mb-4"></div>
                            <div class="space-y-4">
                                <div>
                                    <div class="flex justify-between mb-1">
                                        <div class="skeleton h-4 w-24"></div>
                                        <div class="skeleton h-4 w-28"></div>
                                    </div>
                                    <div class="skeleton h-3 w-full rounded-full"></div>
                                    <div class="flex justify-between mt-1">
                                        <div class="skeleton h-3 w-16"></div>
                                        <div class="skeleton h-3 w-16"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between mb-1">
                                        <div class="skeleton h-4 w-24"></div>
                                        <div class="skeleton h-4 w-28"></div>
                                    </div>
                                    <div class="skeleton h-3 w-full rounded-full"></div>
                                    <div class="flex justify-between mt-1">
                                        <div class="skeleton h-3 w-16"></div>
                                        <div class="skeleton h-3 w-16"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between mb-1">
                                        <div class="skeleton h-4 w-24"></div>
                                        <div class="skeleton h-4 w-28"></div>
                                    </div>
                                    <div class="skeleton h-3 w-full rounded-full"></div>
                                    <div class="flex justify-between mt-1">
                                        <div class="skeleton h-3 w-16"></div>
                                        <div class="skeleton h-3 w-16"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-4 flex justify-end">
                                <div class="skeleton h-8 w-32"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Skeleton Recent Transactions -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <div class="flex justify-between items-center mb-4">
                        <div class="skeleton h-6 w-40"></div>
                        <div class="skeleton h-8 w-20"></div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="table w-full">
                            <thead>
                                <tr>
                                    <th><div class="skeleton h-4 w-12"></div></th>
                                    <th><div class="skeleton h-4 w-20"></div></th>
                                    <th class="hidden md:table-cell"><div class="skeleton h-4 w-16"></div></th>
                                    <th class="hidden md:table-cell"><div class="skeleton h-4 w-16"></div></th>
                                    <th class="text-right"><div class="skeleton h-4 w-16 ml-auto"></div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><div class="skeleton h-4 w-20"></div></td>
                                    <td><div class="skeleton h-4 w-32"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-6 w-20"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-4 w-24"></div></td>
                                    <td class="text-right"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                </tr>
                                <tr>
                                    <td><div class="skeleton h-4 w-20"></div></td>
                                    <td><div class="skeleton h-4 w-32"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-6 w-20"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-4 w-24"></div></td>
                                    <td class="text-right"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                </tr>
                                <tr>
                                    <td><div class="skeleton h-4 w-20"></div></td>
                                    <td><div class="skeleton h-4 w-32"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-6 w-20"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-4 w-24"></div></td>
                                    <td class="text-right"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                </tr>
                                <tr>
                                    <td><div class="skeleton h-4 w-20"></div></td>
                                    <td><div class="skeleton h-4 w-32"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-6 w-20"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-4 w-24"></div></td>
                                    <td class="text-right"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                </tr>
                                <tr>
                                    <td><div class="skeleton h-4 w-20"></div></td>
                                    <td><div class="skeleton h-4 w-32"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-6 w-20"></div></td>
                                    <td class="hidden md:table-cell"><div class="skeleton h-4 w-24"></div></td>
                                    <td class="text-right"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Skeleton Quick Actions -->
            <div class="flex flex-wrap gap-4">
                <div class="skeleton h-10 w-40"></div>
                <div class="skeleton h-10 w-40"></div>
                <div class="skeleton h-10 w-40"></div>
            </div>
        </div>
    </template>
    
    <!-- Transaction Edit Modal -->
    <dialog id="transactionModal" class="modal modal-middle sm:modal-middle">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4" id="modalTitle">Edit Transaction</h3>
            <input type="hidden" id="transactionId" value="">
            <form id="transactionForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Type</span></label>
                        <select id="transactionType" name="type" class="select select-bordered w-full select-sm sm:select-md">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                            <option value="transfer">Transfer</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Amount</span></label>
                        <input type="number" id="amount" name="amount" step="0.01" class="input input-bordered input-sm sm:input-md" required>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm" id="sourceAccountLabel">Account</span></label>
                        <select id="accountId" name="accountId" class="select select-bordered w-full select-sm sm:select-md" required>
                            <option value="">Select Account</option>
                        </select>
                    </div>
                    <div class="form-control hidden" id="destinationAccountContainer">
                        <label class="label py-1"><span class="label-text font-medium text-sm">To Account</span></label>
                        <select id="destinationAccountId" name="destinationAccountId" class="select select-bordered w-full select-sm sm:select-md">
                            <option value="">Select Destination Account</option>
                        </select>
                    </div>
                    <div class="form-control" id="categoryContainer">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Category</span></label>
                        <select id="categoryId" name="categoryId" class="select select-bordered w-full select-sm sm:select-md" required>
                            <option value="">Select Category</option>
                        </select>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label py-1"><span class="label-text font-medium text-sm">Description</span></label>
                    <input type="text" id="description" name="description" class="input input-bordered input-sm sm:input-md" required placeholder="e.g., Grocery shopping">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Date</span></label>
                        <input type="date" id="transactionDate" name="date" class="input input-bordered input-sm sm:input-md" required>
                    </div>
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Notes</span></label>
                        <input type="text" id="notes" name="notes" class="input input-bordered input-sm sm:input-md" placeholder="Optional notes">
                    </div>
                </div>
                <div class="modal-action pt-2">
                    <button type="button" class="btn btn-sm sm:btn-md btn-ghost" onclick="transactionModal.close()">Cancel</button>
                    <button type="submit" class="btn btn-sm sm:btn-md btn-primary">Save Transaction</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>
    
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/components/summary-cards.js"></script>
    <script src="../js/components/recent-transactions.js"></script>
    <script src="../js/components/budget-overview.js"></script>
    <script src="../js/components/spending-chart.js"></script>
    <script src="../js/pages/dashboard.js"></script>
</body>
</html>
