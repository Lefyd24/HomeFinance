<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <style>
        /* ── Documents-specific styles ─────────────────────────── */
        .doc-explorer {
            display: flex;
            gap: 0;
            min-height: 600px;
        }

        /* Folder sidebar */
        .doc-folders-panel {
            width: 220px;
            flex-shrink: 0;
            border-right: 1px solid oklch(var(--b3));
            padding: 0.5rem 0;
        }

        .folder-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 1rem;
            border-radius: 0.5rem;
            margin: 0.1rem 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.12s ease, color 0.12s ease;
            user-select: none;
        }

        .folder-item:hover {
            background: oklch(var(--b2));
        }

        .folder-item.active {
            background: oklch(var(--p) / 0.12);
            color: oklch(var(--p));
            font-weight: 500;
        }

        .folder-item .folder-count {
            margin-left: auto;
            font-size: 0.72rem;
            opacity: 0.5;
            background: oklch(var(--b3));
            border-radius: 999px;
            padding: 0.1rem 0.45rem;
            min-width: 1.4rem;
            text-align: center;
        }

        .folder-item.active .folder-count {
            background: oklch(var(--p) / 0.2);
        }

        /* Document grid */
        .doc-grid-panel {
            flex: 1;
            min-width: 0;
            padding: 1.25rem;
        }

        .doc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.875rem;
        }

        .doc-list-view .doc-grid {
            grid-template-columns: 1fr;
            gap: 0.375rem;
        }

        /* Document card — grid */
        .doc-card {
            position: relative;
            background: oklch(var(--b1));
            border: 1px solid oklch(var(--b3));
            border-radius: 0.875rem;
            padding: 1.1rem 0.875rem 0.875rem;
            cursor: pointer;
            transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.625rem;
            text-align: center;
        }

        .doc-card:hover {
            box-shadow: 0 4px 20px oklch(var(--p) / 0.1);
            border-color: oklch(var(--p) / 0.35);
            transform: translateY(-2px);
        }

        .doc-card .doc-icon-wrap {
            width: 56px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            flex-shrink: 0;
        }

        .doc-card .doc-name {
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.3;
            max-width: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-word;
        }

        .doc-card .doc-meta {
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .doc-card .doc-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: none;
            gap: 0.25rem;
        }

        .doc-card:hover .doc-actions {
            display: flex;
        }

        /* Document row — list */
        .doc-row {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.6rem 0.75rem;
            border-radius: 0.625rem;
            cursor: pointer;
            background: oklch(var(--b1));
            border: 1px solid oklch(var(--b3));
            transition: background 0.12s ease, border-color 0.12s ease;
        }

        .doc-row:hover {
            background: oklch(var(--b2));
            border-color: oklch(var(--p) / 0.25);
        }

        .doc-row .doc-row-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
        }

        .doc-row .doc-row-name {
            font-size: 0.875rem;
            font-weight: 500;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-row .doc-row-meta {
            font-size: 0.75rem;
            opacity: 0.5;
            white-space: nowrap;
        }

        .doc-row .doc-row-actions {
            display: none;
            gap: 0.25rem;
        }

        .doc-row:hover .doc-row-actions {
            display: flex;
        }

        /* Preview panel — appended to <body> by JS so no stacking-context ancestor clips it */
        .doc-preview-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 480px;
            min-width: 280px;
            max-width: 90vw;
            background: oklch(var(--b1));
            border-left: 1px solid oklch(var(--b3));
            box-shadow: -8px 0 40px oklch(0% 0 0 / 0.15);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            transform: translateX(110%);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.28s ease;
            will-change: transform;
            user-select: none;
        }

        .doc-preview-panel.open {
            transform: translateX(0);
            box-shadow: -12px 0 48px oklch(0% 0 0 / 0.18);
        }

        /* Drag-resize handle on left edge */
        .preview-resize-handle {
            position: absolute;
            left: -4px;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: col-resize;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-resize-handle::after {
            content: '';
            display: block;
            width: 2px;
            height: 40px;
            border-radius: 2px;
            background: oklch(var(--p) / 0);
            transition: background 0.15s ease;
        }

        .preview-resize-handle:hover::after,
        .doc-preview-panel.resizing .preview-resize-handle::after {
            background: oklch(var(--p) / 0.5);
        }

        .doc-preview-panel.resizing {
            transition: none;
            box-shadow: -12px 0 48px oklch(0% 0 0 / 0.2);
        }

        .doc-preview-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid oklch(var(--b3));
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .doc-preview-body {
            /* Explicit px height set by JS sizePreviewBody() */
            overflow: hidden;
            background: oklch(var(--b2));
            position: relative;
        }

        .doc-preview-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .doc-preview-footer {
            padding: 0.875rem 1.25rem;
            border-top: 1px solid oklch(var(--b3));
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        /* Drag-over folder highlight */
        .folder-item.drag-over {
            background: oklch(var(--p) / 0.12);
            outline: 2px solid oklch(var(--p));
            outline-offset: -2px;
        }

        /* Dragging doc card feedback */
        .doc-card[draggable="true"],
        .doc-row[draggable="true"] {
            cursor: grab;
        }
        .doc-card[draggable="true"]:active,
        .doc-row[draggable="true"]:active {
            cursor: grabbing;
        }

        /* Drop zone */
        .drop-zone-active {
            border-color: oklch(var(--p)) !important;
            background: oklch(var(--p) / 0.05) !important;
        }

        /* Toolbar */
        .doc-toolbar {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid oklch(var(--b3));
            flex-wrap: wrap;
        }

        /* Empty state */
        .doc-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
            opacity: 0.7;
        }

        /* File type colors */
        .ftype-pdf   { background: oklch(92% 0.04 25); color: oklch(52% 0.18 25); }
        .ftype-image { background: oklch(92% 0.04 180); color: oklch(52% 0.15 180); }
        .ftype-word  { background: oklch(92% 0.04 230); color: oklch(52% 0.15 230); }
        .ftype-excel { background: oklch(92% 0.04 145); color: oklch(52% 0.18 145); }
        .ftype-text  { background: oklch(92% 0.03 80); color: oklch(52% 0.12 80); }
        .ftype-zip   { background: oklch(92% 0.03 300); color: oklch(52% 0.12 300); }
        .ftype-other { background: oklch(92% 0.01 250); color: oklch(52% 0.05 250); }

        [data-theme="dark-fin"] .ftype-pdf   { background: oklch(22% 0.04 25);   color: oklch(72% 0.18 25); }
        [data-theme="dark-fin"] .ftype-image { background: oklch(22% 0.04 180);  color: oklch(72% 0.15 180); }
        [data-theme="dark-fin"] .ftype-word  { background: oklch(22% 0.04 230);  color: oklch(72% 0.15 230); }
        [data-theme="dark-fin"] .ftype-excel { background: oklch(22% 0.04 145);  color: oklch(72% 0.18 145); }
        [data-theme="dark-fin"] .ftype-text  { background: oklch(22% 0.03 80);   color: oklch(72% 0.12 80); }
        [data-theme="dark-fin"] .ftype-zip   { background: oklch(22% 0.03 300);  color: oklch(72% 0.12 300); }
        [data-theme="dark-fin"] .ftype-other { background: oklch(22% 0.01 250);  color: oklch(72% 0.05 250); }

        /* Upload modal override */
        #uploadModal .modal-box { max-width: 440px; }

        /* Rename folder inline input */
        .folder-new-input {
            padding: 0.3rem 0.75rem;
            margin: 0.1rem 0.5rem;
            border-radius: 0.5rem;
            border: 1.5px solid oklch(var(--p));
            font-size: 0.875rem;
            background: oklch(var(--b1));
            color: oklch(var(--bc));
            outline: none;
            width: calc(100% - 1rem);
        }

        @media (max-width: 640px) {
            .doc-explorer { flex-direction: column; }
            .doc-folders-panel { width: 100%; border-right: none; border-bottom: 1px solid oklch(var(--b3)); display: flex; flex-wrap: wrap; gap: 0.25rem; padding: 0.5rem; }
            .folder-item { padding: 0.3rem 0.75rem; }
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>

    <template id="documents-template">
        <div class="space-y-0 -mx-4 -my-4 lg:-mx-6 lg:-my-6">

            <!-- Page header -->
            <div class="px-6 pt-6 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h1 class="text-xl font-semibold flex items-center gap-2.5">
                        <span class="w-8 h-8 rounded-lg ftype-pdf flex items-center justify-center text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                        </span>
                        Documents
                    </h1>
                    <p class="text-sm text-base-content/50 mt-0.5">Bank agreements, insurance, bills, receipts and more</p>
                </div>
                <div class="flex gap-2 shrink-0">
                    <button onclick="showNewFolderInput()" class="btn btn-ghost btn-sm gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                        </svg>
                        New Folder
                    </button>
                    <button onclick="document.getElementById('uploadModal').showModal()" class="btn btn-primary btn-sm gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        Upload
                    </button>
                </div>
            </div>

            <!-- Main explorer -->
            <div class="bg-base-100 border border-base-200 mx-4 mb-4 rounded-2xl overflow-hidden">
                <!-- Toolbar -->
                <div class="doc-toolbar">
                    <!-- Search -->
                    <div class="relative flex-1 min-w-[180px]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3 top-1/2 -translate-y-1/2 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input
                            id="docSearch"
                            type="text"
                            placeholder="Search documents..."
                            class="input input-bordered input-sm pl-9 w-full"
                            oninput="handleSearch()"
                        />
                    </div>

                    <div class="flex items-center gap-1 ml-auto">
                        <!-- Doc count -->
                        <span id="docCount" class="text-xs text-base-content/40 mr-2"></span>
                        <!-- View toggles -->
                        <div class="join">
                            <button id="viewGrid" class="join-item btn btn-xs btn-ghost btn-active" onclick="setView('grid')" title="Grid view">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                                </svg>
                            </button>
                            <button id="viewList" class="join-item btn btn-xs btn-ghost" onclick="setView('list')" title="List view">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="doc-explorer" id="docExplorer">
                    <!-- Folders sidebar -->
                    <div class="doc-folders-panel" id="foldersPanel">
                        <!-- Populated by JS -->
                    </div>

                    <!-- Documents area -->
                    <div class="doc-grid-panel" id="docsPanel">
                        <div class="doc-grid" id="docGrid">
                            <!-- Documents populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Preview panel (slide-in) — JS moves this to document.body on init -->
        <div id="previewPanel" class="doc-preview-panel">
            <div class="preview-resize-handle" id="previewResizeHandle" title="Drag to resize"></div>
            <div class="doc-preview-header">
                <div id="previewIconWrap" class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0"></div>
                <div class="flex-1 min-w-0">
                    <p id="previewTitle" class="font-semibold text-sm truncate"></p>
                    <p id="previewMeta" class="text-xs opacity-50 mt-0.5"></p>
                </div>
                <button onclick="closePreview()" class="btn btn-ghost btn-xs btn-square ml-1 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="doc-preview-body" id="previewBody"></div>
            <div class="doc-preview-footer">
                <a id="previewDownloadBtn" href="#" class="btn btn-primary btn-sm flex-1 gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download
                </a>
                <button id="previewDeleteBtn" class="btn btn-ghost btn-sm btn-error gap-1.5" onclick="deleteCurrentPreview()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    Delete
                </button>
            </div>
        </div>
    </template>

    <!-- Upload Modal -->
    <dialog id="uploadModal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
            <h3 class="font-bold text-base mb-1">Upload Document</h3>
            <p class="text-sm opacity-50 mb-4">PDF, images, Word, Excel, and text files up to 50 MB</p>

            <form id="uploadForm" class="space-y-3">
                <!-- Drop zone -->
                <div
                    id="dropZone"
                    class="border-2 border-dashed border-base-300 rounded-xl p-6 text-center cursor-pointer transition-all"
                    onclick="document.getElementById('fileInput').click()"
                    ondragover="handleDragOver(event)"
                    ondragleave="handleDragLeave(event)"
                    ondrop="handleDrop(event)"
                >
                    <div id="dropZoneContent">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-2 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-sm font-medium opacity-60">Drop file here or click to browse</p>
                        <p class="text-xs opacity-40 mt-1">PDF, JPG, PNG, DOCX, XLSX, TXT, CSV...</p>
                    </div>
                    <div id="dropZoneSelected" class="hidden">
                        <div id="selectedFileIcon" class="mx-auto mb-2 w-12 h-12 rounded-lg flex items-center justify-center"></div>
                        <p id="selectedFileName" class="text-sm font-medium truncate max-w-xs mx-auto"></p>
                        <p id="selectedFileSize" class="text-xs opacity-40 mt-0.5"></p>
                    </div>
                </div>
                <input type="file" id="fileInput" class="hidden" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.svg,.doc,.docx,.xls,.xlsx,.txt,.csv,.zip" onchange="handleFileSelect(this)">

                <fieldset class="fieldset">
                    <legend class="fieldset-legend text-xs">Title <span class="text-error">*</span></legend>
                    <input type="text" id="docTitle" class="input input-bordered w-full input-sm" placeholder="e.g. Bank Agreement March 2024" required>
                </fieldset>

                <fieldset class="fieldset">
                    <legend class="fieldset-legend text-xs">Description <span class="opacity-40">(optional)</span></legend>
                    <textarea id="docDescription" class="textarea textarea-bordered w-full textarea-sm resize-none" rows="2" placeholder="Brief note about this document..."></textarea>
                </fieldset>

                <fieldset class="fieldset">
                    <legend class="fieldset-legend text-xs">Folder</legend>
                    <div class="flex gap-2">
                        <select id="docFolder" class="select select-bordered select-sm flex-1">
                            <option value="">No folder</option>
                        </select>
                        <input type="text" id="docFolderNew" class="input input-bordered input-sm flex-1 hidden" placeholder="New folder name...">
                        <button type="button" id="newFolderToggle" class="btn btn-ghost btn-sm btn-square" onclick="toggleFolderInput()" title="Create new folder">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </div>
                </fieldset>

                <div id="uploadProgress" class="hidden">
                    <div class="flex items-center gap-2 text-sm">
                        <span class="loading loading-spinner loading-xs"></span>
                        <span>Uploading...</span>
                    </div>
                </div>

                <div class="modal-action mt-4">
                    <button type="button" class="btn btn-ghost btn-sm" onclick="closeUploadModal()">Cancel</button>
                    <button type="submit" id="uploadBtn" class="btn btn-primary btn-sm gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        Upload
                    </button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- Edit Document Modal -->
    <dialog id="editModal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
            <h3 class="font-bold text-base mb-4">Edit Document</h3>
            <form id="editForm" class="space-y-3">
                <input type="hidden" id="editDocId">
                <fieldset class="fieldset">
                    <legend class="fieldset-legend text-xs">Title</legend>
                    <input type="text" id="editTitle" class="input input-bordered w-full input-sm" required>
                </fieldset>
                <fieldset class="fieldset">
                    <legend class="fieldset-legend text-xs">Description</legend>
                    <textarea id="editDescription" class="textarea textarea-bordered w-full textarea-sm resize-none" rows="2"></textarea>
                </fieldset>
                <fieldset class="fieldset">
                    <legend class="fieldset-legend text-xs">Folder</legend>
                    <div class="flex gap-2">
                        <select id="editFolder" class="select select-bordered select-sm flex-1"></select>
                        <input type="text" id="editFolderNew" class="input input-bordered input-sm flex-1 hidden" placeholder="New folder name...">
                        <button type="button" class="btn btn-ghost btn-sm btn-square" onclick="toggleEditFolderInput()" title="New folder">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </div>
                </fieldset>
                <div class="modal-action mt-4">
                    <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('editModal').close()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/documents.js"></script>
</body>
</html>
