<body class="bg-base-200 min-h-screen">
    <div id="app"></div>
    
    <!-- Skeleton Loading Template -->
    <template id="transactions-skeleton">
        <div class="space-y-4 md:space-y-6">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 md:gap-4">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold">Transactions</h1>
                    <p class="text-base-content/60">Manage your financial transactions</p>
                </div>
                <button onclick="openTransactionModal()" class="btn btn-primary btn-sm sm:btn-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                    </svg>
                    Add Transaction
                </button>
            </div>
            
            <!-- Search Bar -->
            <div class="card bg-base-100 shadow-sm">
                <div class="card-body p-3 md:p-4">
                    <div class="relative">
                        <input type="text" id="searchDescription" placeholder="Search transactions..." class="input input-bordered w-full input-sm sm:input-md pr-10" oninput="handleSearch(event)">
                        <button id="clearSearch" class="btn btn-ghost btn-circle btn-sm absolute right-2 top-1/2 transform -translate-y-1/2 hidden" onclick="clearSearch()">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Filters -->
            <div class="card bg-base-100 shadow-sm">
                <div class="card-body p-3 md:p-4">
                    <div class="flex flex-wrap gap-2 md:gap-4">
                        <div class="flex-1 min-w-[140px]">
                            <label class="label py-1"><span class="label-text font-medium text-sm">From Date</span></label>
                            <input type="date" id="filterFromDate" class="input input-bordered w-full input-sm sm:input-md">
                        </div>
                        <div class="flex-1 min-w-[140px]">
                            <label class="label py-1"><span class="label-text font-medium text-sm">To Date</span></label>
                            <input type="date" id="filterToDate" class="input input-bordered w-full input-sm sm:input-md">
                        </div>
                        <div class="flex-1 min-w-[140px]">
                            <label class="label py-1"><span class="label-text font-medium text-sm">Account</span></label>
                            <select id="filterAccount" class="select select-bordered w-full select-sm sm:select-md">
                                <option value="">All Accounts</option>
                            </select>
                        </div>
                        <div class="flex-1 min-w-[140px]">
                            <label class="label py-1"><span class="label-text font-medium text-sm">Category</span></label>
                            <select id="filterCategory" class="select select-bordered w-full select-sm sm:select-md">
                                <option value="">All Categories</option>
                            </select>
                        </div>
                        <div class="flex-1 min-w-[120px]">
                            <label class="label py-1"><span class="label-text font-medium text-sm">Type</span></label>
                            <select id="filterType" class="select select-bordered w-full select-sm sm:select-md">
                                <option value="">All Types</option>
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                                <option value="transfer">Transfer</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="applyFilters()" class="btn btn-primary btn-sm sm:btn-md">Apply Filters</button>
                        </div>
                    </div>
                </div>
            </div>

                                </tr>

                                    <td class="text-right py-3 md:py-4 pr-3 md:pr-4"><div class="skeleton h-4 w-20 ml-auto"></div></td>
                                </tr>
                                <tr class="border-b border-base-200/50">

                                </tr>

                                    <td class="py-3 md:py-4">

                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Skeleton Pagination -->
                    <div id="pagination" class="flex justify-center mt-4">
                        <div class="flex gap-1">
                            <div class="skeleton h-8 w-8 rounded-lg"></div>
                            <div class="skeleton h-8 w-8 rounded-lg"></div>
                            <div class="skeleton h-8 w-8 rounded-lg"></div>
                            <div class="skeleton h-8 w-8 rounded-lg"></div>

            </div>
        </div>

    <!-- Add/Edit Transaction Modal -->
    <dialog id="transactionModal" class="modal modal-middle sm:modal-middle">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4" id="modalTitle">Add Transaction</h3>
            <input type="hidden" id="transactionId" value="">
            <form id="transactionForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Type</span></label>
                        <select id="transactionType" name="type" class="select select-bordered w-full select-sm sm:select-md">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                            <option value="transfer">Transfer</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Amount</span></label>
                        <input type="number" id="amount" name="amount" step="0.01" class="input input-bordered input-sm sm:input-md" required>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm" id="sourceAccountLabel">Account</span></label>
                        <select id="accountId" name="accountId" class="select select-bordered w-full select-sm sm:select-md" required>
                            <option value="">Select Account</option>
                        </select>
                    </div>
                    <div class="form-control hidden" id="destinationAccountContainer">
                        <label class="label py-1"><span class="label-text font-medium text-sm">To Account</span></label>
                        <select id="destinationAccountId" name="destinationAccountId" class="select select-bordered w-full select-sm sm:select-md">
                            <option value="">Select Destination Account</option>
                        </select>
                    </div>
                    <div class="form-control" id="categoryContainer">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Category</span></label>
                        <select id="categoryId" name="categoryId" class="select select-bordered w-full select-sm sm:select-md" required>
                            <option value="">Select Category</option>
                            <!-- Categories will be populated here -->
                        </select>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label py-1"><span class="label-text font-medium text-sm">Description</span></label>
                    <input type="text" id="description" name="description" class="input input-bordered input-sm sm:input-md" required placeholder="e.g., Grocery shopping">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Date</span></label>
                        <input type="date" id="transactionDate" name="date" class="input input-bordered input-sm sm:input-md" required>
                    </div>
                    <div class="form-control">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Notes</span></label>
                        <input type="text" id="notes" name="notes" class="input input-bordered input-sm sm:input-md" placeholder="Optional notes">
                    </div>
                </div>
                
                <!-- Debt Payment Link -->
                <div class="form-control border-t border-base-300 pt-4 mt-2" id="debtPaymentContainer">
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" id="linkToDebt" class="checkbox checkbox-sm" onchange="toggleDebtSelect()">
                        <span class="label-text font-medium">This is a debt payment</span>
                    </label>
                    <div id="debtSelectContainer" class="mt-2 hidden">
                        <label class="label py-1"><span class="label-text font-medium text-sm">Select Debt</span></label>
                        <select id="debtId" name="debtId" class="select select-bordered w-full select-sm sm:select-md">
                            <option value="">Select a debt...</option>
                        </select>
                        <label class="label">
                            <span class="label-text-alt text-info">This will create a linked debt payment record</span>
                        </label>
                    </div>
                </div>
                
                <div class="modal-action pt-2">
                    <button type="button" class="btn btn-sm sm:btn-md btn-ghost" onclick="transactionModal.close()">Cancel</button>
                    <button type="submit" class="btn btn-sm sm:btn-md btn-primary">Save Transaction</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>
