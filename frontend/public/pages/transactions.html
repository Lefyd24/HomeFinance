<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Personal Finance</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>
    
    <!-- Add/Edit Transaction Modal -->
    <dialog id="transactionModal" class="modal">
        <div class="modal-box w-11/12 max-w-2xl">
            <h3 class="font-bold text-lg mb-4" id="modalTitle">Add Transaction</h3>
            <input type="hidden" id="transactionId" value="">
            <form id="transactionForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Type</span></label>
                        <select id="transactionType" name="type" class="select select-bordered w-full">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                            <option value="transfer">Transfer</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Amount</span></label>
                        <input type="number" id="amount" name="amount" step="0.01" class="input input-bordered" required>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text" id="sourceAccountLabel">Account</span></label>
                        <select id="accountId" name="accountId" class="select select-bordered w-full" required>
                            <option value="">Select Account</option>
                        </select>
                    </div>
                    <div class="form-control" id="destinationAccountContainer" style="display: none;">
                        <label class="label"><span class="label-text">To Account</span></label>
                        <select id="destinationAccountId" name="destinationAccountId" class="select select-bordered w-full">
                            <option value="">Select Destination Account</option>
                        </select>
                    </div>
                    <div class="form-control" id="categoryContainer">
                        <label class="label"><span class="label-text">Category</span></label>
                        <select id="categoryId" name="categoryId" class="select select-bordered w-full">
                            <option value="">Select Category</option>
                        </select>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Description</span></label>
                    <input type="text" id="description" name="description" class="input input-bordered" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Date</span></label>
                        <input type="date" id="transactionDate" name="date" class="input input-bordered" required>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Notes</span></label>
                        <input type="text" id="notes" name="notes" class="input input-bordered">
                    </div>
                </div>
                <div class="modal-action">
                    <button type="button" class="btn" onclick="transactionModal.close()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Transaction</button>
                </div>
            </form>
        </div>
    </dialog>
    
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/transactions.js"></script>
</body>
</html>
