<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Personal Finance</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
</head>
<body class="min-h-screen flex items-center justify-center bg-base-200 p-6">
    <div class="card w-full max-w-sm bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="text-2xl font-bold text-base-content">Forgot password</h2>
            <p class="text-sm text-base-content opacity-60 mt-1 mb-4">
                Enter your account email and we'll send you a link to reset your password.
            </p>

            <form id="forgotPasswordForm" class="flex flex-col gap-4">
                <div>
                    <label for="email" class="text-sm font-medium text-base-content block mb-1">Email address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com"
                           class="input input-bordered w-full" required autocomplete="email">
                </div>

                <div id="errorMessage" class="alert alert-error hidden text-sm py-2">
                    <span id="errorText"></span>
                </div>
                <div id="successMessage" class="alert alert-success hidden text-sm py-2">
                    <span id="successText"></span>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-full">
                    <span id="btnText">Send reset link</span>
                    <span id="loadingSpinner" class="loading loading-spinner loading-sm hidden"></span>
                </button>
            </form>

            <p class="text-sm text-center text-base-content mt-5 opacity-60">
                <a href="../index.html" class="text-primary font-semibold" style="opacity:1;">Back to sign in</a>
            </p>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/forgot-password.js"></script>
</body>
</html>
