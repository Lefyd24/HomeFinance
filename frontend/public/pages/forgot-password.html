<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Forgot Password - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Home Finance">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <style>
        .auth-shell {
            min-height: 100dvh;
            padding-top: max(1.5rem, env(safe-area-inset-top));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }

        .mobile-logo {
            width: 2.75rem;
            height: 2.75rem;
            background-color: oklch(52% 0.105 223.128);
            color: oklch(98% 0.019 200.873);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .form-input-group { position: relative; }

        .form-input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-base-content, #333);
            opacity: 0.35;
            pointer-events: none;
        }

        .form-input-padded { padding-left: 2.25rem; }

        .btn-auth {
            height: 2.75rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-auth:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px oklch(52% 0.105 223.128 / 0.35);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            color: var(--color-base-content, #333);
            opacity: 0.55;
            font-size: 0.8125rem;
            font-weight: 500;
        }
        .back-link:hover { opacity: 0.85; }
    </style>
</head>
<body class="auth-shell min-h-screen flex items-center justify-center bg-base-200 px-4 sm:px-6">
    <div style="width:100%;max-width:24rem;">

        <a href="../index.html" class="back-link mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Back to sign in
        </a>

        <div class="flex items-center gap-3 mb-7">
            <div class="mobile-logo">
                <img src="/assets/icons/favicon.ico" alt="Home Finance" class="h-7 w-7" />
            </div>
            <span class="font-bold text-lg text-base-content">Home Finance</span>
        </div>

        <div class="mb-7">
            <h2 class="text-2xl sm:text-3xl font-bold text-base-content" style="line-height:1.2;letter-spacing:-0.02em;">Forgot password?</h2>
            <p class="text-base-content mt-2 text-sm" style="opacity:0.55;">Enter your account email and we'll send you a link to reset it.</p>
        </div>

        <form id="forgotPasswordForm" class="flex flex-col gap-4">
            <div>
                <label for="email" class="text-sm font-medium text-base-content" style="display:block;margin-bottom:0.375rem;opacity:0.8;">Email address</label>
                <div class="form-input-group">
                    <span class="form-input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" placeholder="name@example.com"
                           class="input input-bordered w-full form-input-padded"
                           style="height:2.75rem;" required autocomplete="email">
                </div>
            </div>

            <div id="errorMessage" class="alert alert-error hidden" style="padding:0.625rem 0.875rem;border-radius:0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span id="errorText" class="text-sm"></span>
            </div>
            <div id="successMessage" class="alert alert-success hidden" style="padding:0.625rem 0.875rem;border-radius:0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" style="width:1rem;height:1rem;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span id="successText" class="text-sm"></span>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-full btn-auth">
                <span id="btnText">Send reset link</span>
                <span id="loadingSpinner" class="loading loading-spinner loading-sm hidden"></span>
            </button>
        </form>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/forgot-password.js"></script>
</body>
</html>
