<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts - Personal Finance</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>
    
    <!-- Add Account Modal -->
    <dialog id="accountModal" class="modal">
        <div class="modal-box w-11/12 max-w-lg">
            <h3 class="font-bold text-lg mb-4">Add Account</h3>
            <form id="accountForm" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Account Name</span></label>
                    <input type="text" id="accountName" name="name" placeholder="e.g., Eurobank, Wallet" 
                           class="input input-bordered" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Type</span></label>
                        <select id="accountType" name="type" class="select select-bordered w-full">
                            <option value="checking">Checking</option>
                            <option value="savings">Savings</option>
                            <option value="credit">Credit Card</option>
                            <option value="cash">Cash</option>
                            <option value="investment">Investment</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Currency</span></label>
                        <select id="currency" name="currency" class="select select-bordered w-full">
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Current Balance</span></label>
                    <input type="number" id="balance" name="balance" step="0.01" value="0" 
                           class="input input-bordered">
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">Description</span></label>
                    <textarea id="accountDescription" name="description" class="textarea textarea-bordered" 
                              rows="2"></textarea>
                </div>
                <div class="modal-action">
                    <button type="button" class="btn" onclick="accountModal.close()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Account</button>
                </div>
            </form>
        </div>
    </dialog>
    
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/components/account-card.js"></script>
    <script src="../js/pages/accounts.js"></script>
</body>
</html>
