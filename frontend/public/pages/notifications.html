<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5a4">
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app">
        <!-- Content will be injected by layout.js -->
    </div>

    <template id="notifications-content">
        <div class="space-y-6">
            <!-- Channel toggles -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title text-xl flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        Notification Channels
                    </h2>
                    <p class="text-base-content/70 text-sm">
                        Choose how you want to receive alerts for balances, budgets, and scheduled reports.
                    </p>

                    <form id="channelsForm" class="mt-4 space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 bg-base-200 rounded-lg">
                            <div>
                                <p class="font-medium">Email notifications</p>
                                <p class="text-sm text-base-content/60">Send alerts to your account email address</p>
                            </div>
                            <input type="checkbox" id="emailEnabled" class="toggle toggle-primary" />
                        </div>
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 bg-base-200 rounded-lg">
                            <div>
                                <p class="font-medium">Push notifications</p>
                                <p class="text-sm text-base-content/60">Desktop browser notifications when enabled</p>
                            </div>
                            <input type="checkbox" id="pushEnabled" class="toggle toggle-primary" />
                        </div>
                        <div class="flex flex-wrap gap-2 pt-2 items-center">
                            <button type="button" id="enableDesktopBtn" class="btn btn-outline btn-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                </svg>
                                Enable desktop notifications
                            </button>
                            <button type="button" id="disableDesktopBtn" class="btn btn-ghost btn-sm hidden">
                                Disable desktop notifications
                            </button>
                            <span id="desktopPushStatus" class="text-sm text-base-content/60"></span>
                            <button type="button" id="runRulesBtn" class="btn btn-outline btn-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                                Check rules now
                            </button>
                            <button type="button" id="testNotificationBtn" class="btn btn-primary btn-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                                </svg>
                                Send test notification
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- General settings -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title text-lg">General Settings</h2>
                    <form id="settingsForm" class="mt-4 space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">Default days before</legend>
                                <input type="number" id="defaultDaysBefore" class="input input-bordered w-full" min="1" max="90" />
                                <p class="fieldset-label text-xs opacity-60">For recurring expenses and debt reminders</p>
                            </fieldset>
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">Quiet hours start</legend>
                                <select id="quietHoursStart" class="select select-bordered w-full">
                                    <option value="">None</option>
                                </select>
                                <p class="fieldset-label text-xs opacity-60">Hour (0–23), no notifications sent</p>
                            </fieldset>
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">Quiet hours end</legend>
                                <select id="quietHoursEnd" class="select select-bordered w-full">
                                    <option value="">None</option>
                                </select>
                                <p class="fieldset-label text-xs opacity-60">Hour (0–23)</p>
                            </fieldset>
                        </div>
                        <div class="flex justify-end">
                            <button type="submit" class="btn btn-primary btn-sm">Save settings</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- SMTP override -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <h2 class="card-title text-lg flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-info" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        SMTP Override
                    </h2>
                    <p class="text-sm text-base-content/70">
                        Optional per-user SMTP settings. Unset fields fall back to server <code class="bg-base-200 px-1 rounded text-xs">.env</code> configuration.
                    </p>
                    <form id="smtpForm" class="mt-4 space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">SMTP host</legend>
                                <input type="text" id="smtpHost" class="input input-bordered w-full" placeholder="smtp.example.com" />
                            </fieldset>
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">SMTP port</legend>
                                <input type="number" id="smtpPort" class="input input-bordered w-full" min="1" max="65535" placeholder="587" />
                            </fieldset>
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">SMTP user</legend>
                                <input type="text" id="smtpUser" class="input input-bordered w-full" autocomplete="username" />
                            </fieldset>
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">SMTP password</legend>
                                <input type="password" id="smtpPassword" class="input input-bordered w-full" autocomplete="new-password" placeholder="Leave blank to keep current" />
                                <p id="smtpPasswordHint" class="fieldset-label text-xs opacity-60 hidden">A password is already saved</p>
                            </fieldset>
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">From address</legend>
                                <input type="email" id="smtpFrom" class="input input-bordered w-full" placeholder="noreply@example.com" />
                            </fieldset>
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">Use TLS</legend>
                                <label class="label cursor-pointer justify-start gap-3 mt-2">
                                    <input type="checkbox" id="smtpUseTls" class="toggle toggle-primary" />
                                    <span class="label-text">Enable TLS</span>
                                </label>
                            </fieldset>
                        </div>
                        <div class="flex justify-end">
                            <button type="submit" class="btn btn-primary btn-sm">Save SMTP settings</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Rules -->
            <div class="card bg-base-100 shadow-lg">
                <div class="card-body">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="card-title text-lg">Notification Rules</h2>
                            <p class="text-sm text-base-content/70 mt-1">
                                Custom alerts for low balances, budget usage, and scheduled reports.
                                For desktop alerts, enable push above and check <strong>Push</strong> on each rule.
                            </p>
                        </div>
                        <button type="button" id="addRuleBtn" class="btn btn-primary btn-sm shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            Add rule
                        </button>
                    </div>
                    <div id="rulesListContainer" class="mt-4">
                        <div class="flex items-center justify-center p-8">
                            <span class="loading loading-spinner loading-lg text-primary"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Rule modal -->
        <dialog id="ruleModal" class="modal modal-middle sm:modal-middle">
            <div class="modal-box max-w-lg">
                <h3 id="ruleModalTitle" class="font-bold text-lg mb-4">Add notification rule</h3>
                <form id="ruleForm" class="space-y-4">
                    <input type="hidden" id="ruleId" value="" />
                    <fieldset class="fieldset">
                        <legend class="fieldset-legend text-sm">Rule type</legend>
                        <select id="ruleType" class="select select-bordered w-full" required>
                            <option value="balance_below">Balance below threshold</option>
                            <option value="budget_percent">Budget usage percent</option>
                            <option value="scheduled_report">Scheduled report</option>
                        </select>
                    </fieldset>
                    <fieldset class="fieldset">
                        <legend class="fieldset-legend text-sm">Name</legend>
                        <input type="text" id="ruleName" class="input input-bordered w-full" required maxlength="200" placeholder="e.g. Checking account low balance" />
                    </fieldset>
                    <fieldset class="fieldset" id="ruleTargetField">
                        <legend class="fieldset-legend text-sm" id="ruleTargetLabel">Account</legend>
                        <select id="ruleTargetId" class="select select-bordered w-full">
                            <option value="">Select…</option>
                        </select>
                    </fieldset>
                    <fieldset class="fieldset" id="ruleThresholdField">
                        <legend class="fieldset-legend text-sm" id="ruleThresholdLabel">Threshold</legend>
                        <input type="number" id="ruleThreshold" class="input input-bordered w-full" step="0.01" min="0" />
                    </fieldset>
                    <div id="ruleScheduleFields" class="space-y-4 hidden">
                        <fieldset class="fieldset">
                            <legend class="fieldset-legend text-sm">Report type</legend>
                            <select id="ruleReportType" class="select select-bordered w-full">
                                <option value="spending">Spending</option>
                                <option value="cashflow">Cashflow</option>
                                <option value="income">Income</option>
                            </select>
                        </fieldset>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <fieldset class="fieldset">
                                <legend class="fieldset-legend text-sm">Schedule</legend>
                                <select id="ruleScheduleKind" class="select select-bordered w-full">
                                    <option value="every_n_days">Every N days</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="monthly">Monthly</option>
                                </select>
                            </fieldset>
                            <fieldset class="fieldset" id="ruleScheduleValueField">
                                <legend class="fieldset-legend text-sm">Every (days)</legend>
                                <input type="number" id="ruleScheduleValue" class="input input-bordered w-full" min="1" value="7" />
                            </fieldset>
                        </div>
                    </div>
                    <fieldset class="fieldset">
                        <legend class="fieldset-legend text-sm">Channels</legend>
                        <div class="flex flex-wrap gap-4 mt-1">
                            <label class="label cursor-pointer gap-2">
                                <input type="checkbox" id="ruleChannelEmail" class="checkbox checkbox-primary checkbox-sm" checked />
                                <span class="label-text">Email</span>
                            </label>
                            <label class="label cursor-pointer gap-2">
                                <input type="checkbox" id="ruleChannelPush" class="checkbox checkbox-primary checkbox-sm" />
                                <span class="label-text">Push</span>
                            </label>
                        </div>
                    </fieldset>
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" id="ruleIsActive" class="toggle toggle-primary" checked />
                        <span class="label-text">Rule active</span>
                    </label>
                    <div class="modal-action">
                        <button type="button" class="btn btn-ghost" onclick="ruleModal.close()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save rule</button>
                    </div>
                </form>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>

        <!-- Delete rule modal -->
        <dialog id="deleteRuleModal" class="modal modal-middle sm:modal-middle">
            <div class="modal-box">
                <h3 class="font-bold text-lg mb-2 text-error">Delete rule</h3>
                <p class="text-sm text-base-content/70 mb-4">
                    Are you sure you want to delete <strong id="deleteRuleName"></strong>? This cannot be undone.
                </p>
                <div class="modal-action">
                    <button type="button" class="btn btn-ghost" onclick="deleteRuleModal.close()">Cancel</button>
                    <button type="button" id="confirmDeleteRuleBtn" class="btn btn-error">Delete</button>
                </div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
    </template>

    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/push-notifications.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/notifications.js"></script>
</body>
</html>
