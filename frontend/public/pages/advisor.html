<!DOCTYPE html>
<html lang="en" data-theme="light-fin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Advisor - Personal Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="alternate icon" href="../assets/icons/favicon.ico">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-base-200 min-h-screen">
    <div id="app"></div>
    
    <template id="advisor-template">
        <div class="space-y-6">
            <p class="text-sm text-base-content/60">Run financial calculations for investments, loans, emergency funds, and net worth. Select a tool below to get started.</p>

            <!-- Tool Selector Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-4" id="toolSelector">
                <!-- Investment Calculator -->
                <button onclick="selectTool('investment')" class="tool-card card bg-base-100 shadow-md hover:shadow-xl transition-all cursor-pointer border-2 border-transparent hover:border-primary" data-tool="investment">
                    <div class="card-body items-center text-center p-2 sm:p-4">
                        <div class="w-8 h-8 sm:w-12 sm:h-12 rounded-full bg-primary/10 flex items-center justify-center mb-1 sm:mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-6 sm:w-6 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                            </svg>
                        </div>
                        <h3 class="font-semibold text-xs sm:text-sm">Investment</h3>
                        <p class="text-xs text-base-content/60 hidden sm:block">Compound & retirement</p>
                    </div>
                </button>
                
                <!-- Loan Calculator -->
                <button onclick="selectTool('loan')" class="tool-card card bg-base-100 shadow-md hover:shadow-xl transition-all cursor-pointer border-2 border-transparent hover:border-secondary" data-tool="loan">
                    <div class="card-body items-center text-center p-2 sm:p-4">
                        <div class="w-8 h-8 sm:w-12 sm:h-12 rounded-full bg-secondary/10 flex items-center justify-center mb-1 sm:mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-6 sm:w-6 text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                            </svg>
                        </div>
                        <h3 class="font-semibold text-xs sm:text-sm">Loan</h3>
                        <p class="text-xs text-base-content/60 hidden sm:block">Amortization</p>
                    </div>
                </button>
                
                <!-- Emergency Fund -->
                <button onclick="selectTool('emergency')" class="tool-card card bg-base-100 shadow-md hover:shadow-xl transition-all cursor-pointer border-2 border-transparent hover:border-success" data-tool="emergency">
                    <div class="card-body items-center text-center p-2 sm:p-4">
                        <div class="w-8 h-8 sm:w-12 sm:h-12 rounded-full bg-success/10 flex items-center justify-center mb-1 sm:mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-6 sm:w-6 text-success" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                        </div>
                        <h3 class="font-semibold text-xs sm:text-sm">Emergency</h3>
                        <p class="text-xs text-base-content/60 hidden sm:block">Recommendations</p>
                    </div>
                </button>
                
                <!-- Net Worth -->
                <button onclick="selectTool('networth')" class="tool-card card bg-base-100 shadow-md hover:shadow-xl transition-all cursor-pointer border-2 border-transparent hover:border-info" data-tool="networth">
                    <div class="card-body items-center text-center p-2 sm:p-4">
                        <div class="w-8 h-8 sm:w-12 sm:h-12 rounded-full bg-info/10 flex items-center justify-center mb-1 sm:mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-6 sm:w-6 text-info" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                        </div>
                        <h3 class="font-semibold text-xs sm:text-sm">Net Worth</h3>
                        <p class="text-xs text-base-content/60 hidden sm:block">Track wealth</p>
                    </div>
                </button>
            </div>
            
            <!-- Calculator Panels -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-6 items-start">
                <!-- Input Panel -->
                <div class="card bg-base-100 shadow-xl lg:sticky lg:top-4">
                    <div class="card-body p-4 sm:p-6">
                        <h2 class="card-title text-lg sm:text-xl" id="calculatorTitle">Select a Tool</h2>
                        <p class="text-sm text-base-content/60" id="calculatorDescription">Choose a financial tool from above</p>
                        <div class="divider my-2"></div>
                        <div id="calculatorForm">
                            <div class="text-center py-8 text-base-content/40">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 sm:h-16 sm:w-16 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                </svg>
                                <p class="text-sm">Select a tool to begin</p>
                            </div>
                        </div>
                    </div>
                </div>
                
            <!-- Results Panel -->
                <div class="card bg-base-100 shadow-xl">
                    <div class="card-body p-4 sm:p-6">
                        <h2 class="card-title text-lg sm:text-xl">Results</h2>
                        <div class="divider my-2"></div>
                        <div id="resultsPanel" class="max-h-[60vh] sm:max-h-[70vh] overflow-y-auto">
                            <div class="text-center py-8 text-base-content/40">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 sm:h-16 sm:w-16 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                                </svg>
                                <p class="text-sm">Results will appear here</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Chart Panel (shows when needed) -->
            <div class="card bg-base-100 shadow-xl hidden" id="chartPanel">
                <div class="card-body p-4 sm:p-6">
                    <h2 class="card-title text-lg sm:text-xl" id="chartTitle">Visualization</h2>
                    <div class="h-48 sm:h-64 lg:h-80">
                        <canvas id="advisorChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <script src="../js/utils.js"></script>
    <script src="../js/runtime-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/pages/advisor.js"></script>
</body>
</html>
