services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalfinance-app
    ports:
      - "${BACKEND_PORT:-8223}:${BACKEND_PORT:-8223}"
      - "${FRONTEND_PORT:-3100}:${FRONTEND_PORT:-3100}"
    environment:
      - APP_NAME=${APP_NAME}
      - APP_VERSION=${APP_VERSION}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - BACKEND_PORT=${BACKEND_PORT:-8223}
      - FRONTEND_PORT=${FRONTEND_PORT:-3100}
      # AI Chat (DeepSeek) — without these the backend reports configured=false
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - AI_CHAT_MAX_TOOL_ROUNDS=${AI_CHAT_MAX_TOOL_ROUNDS:-6}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${BACKEND_PORT:-8223}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data:
    driver: local
